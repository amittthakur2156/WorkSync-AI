name: worksync_ai
description: Production-grade Flutter application built with Clean Architecture and Riverpod.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.3.2
  
  # Persistence
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.1.1

  # UI & Utilities
  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  uuid: ^4.5.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo_light.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
